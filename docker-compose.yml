# RepoMan with a hardened container configuration.
#
#   docker compose up -d
#   docker compose logs repoman        # the first-run admin password is printed here
#
# To build from this checkout instead of pulling the published image, swap the two lines below.
services:
  repoman:
    image: ghcr.io/anand34577/repoman:latest
    # build: .
    container_name: repoman
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      RM_ACCESS_LOG: "true"
      # Addresses of the reverse proxy in front of RepoMan (if any), so client IPs and https are detected:
      # RM_TRUSTED_PROXIES: "172.16.0.0/12"
      # Serve HTTPS directly instead of using a reverse proxy:
      # RM_TLS_CERT: /certs/fullchain.pem
      # RM_TLS_KEY: /certs/privkey.pem
    volumes:
      - repoman-data:/data
      # - ./certs:/certs:ro
    # Hardening: read-only root filesystem, no capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  repoman-data:
