name: Release

# Push a tag like v1.2.0 to publish a release:
#   git tag v1.2.0 && git push origin v1.2.0
#
# It runs the tests, builds the archives for every platform (binary + service installer + docs),
# publishes a multi-architecture container image to GitHub Container Registry, and creates the
# GitHub release with checksums and signed build provenance.
#
# "Run workflow" (manual) builds the same archives as downloadable workflow artifacts without
# publishing anything: a dry run.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build the web UI
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Test
        working-directory: backend
        run: |
          go vet ./...
          go test -race -count=1 ./...

  binaries:
    name: Build archives
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build stamps the commit and falls back to `git describe`
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-snapshot.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build every platform
        run: scripts/build-release.sh "${{ steps.version.outputs.value }}"

      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: dist/
          if-no-files-found: error
          retention-days: 14

  image:
    name: Container image
    needs: test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}

      - name: Build date
        id: date
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push (amd64, arm64, arm/v7)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.value }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish:
    name: GitHub release
    needs: [binaries, image]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: dist

      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          {
            # the section of CHANGELOG.md for this version ("## [1.2.3]" or "## 1.2.3"), if there is one;
            # an exact comparison, since a regex built from the version treats its dots as wildcards
            awk -v v="$version" '
              /^## / { printing = ($0 == "## [" v "]" || $0 == "## " v) }
              printing { print }
            ' CHANGELOG.md | sed '1d'
            echo
            echo "## Install"
            echo
            echo "Linux and macOS, one line (verifies the checksum, installs the service; run it again to upgrade):"
            echo
            echo "\`\`\`bash"
            echo "curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/get.sh | sudo sh"
            echo "\`\`\`"
            echo
            echo "Or download an archive:"
            echo
            echo "| Platform | Download |"
            echo "|---|---|"
            echo "| Linux x86-64 | \`repoman_${version}_linux_amd64.tar.gz\` |"
            echo "| Linux ARM 64-bit (Raspberry Pi 4/5, Graviton) | \`repoman_${version}_linux_arm64.tar.gz\` |"
            echo "| Linux ARM 32-bit (Raspberry Pi 2/3, armv7) | \`repoman_${version}_linux_armv7.tar.gz\` |"
            echo "| Linux ARM 32-bit (Raspberry Pi 1/Zero, armv6) | \`repoman_${version}_linux_armv6.tar.gz\` |"
            echo "| macOS Apple silicon | \`repoman_${version}_macos_arm64.tar.gz\` |"
            echo "| macOS Intel | \`repoman_${version}_macos_amd64.tar.gz\` |"
            echo "| Windows x86-64 | \`repoman_${version}_windows_amd64.zip\` |"
            echo "| Windows ARM 64-bit | \`repoman_${version}_windows_arm64.zip\` |"
            echo
            echo "Each archive holds the single \`repoman\` binary, a service installer for that platform and the documentation."
            echo "Container image: \`docker pull ${image}:${version}\` (amd64, arm64, arm/v7)."
            echo
            echo "Verify a download: \`sha256sum -c SHA256SUMS --ignore-missing\`, and its origin:"
            echo "\`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`."
            echo
            echo "First run, upgrade and service setup: see \`docs/installation.md\`."
          } > notes.md

      - name: Pin the one-line installer to this release
        run: |
          # installs exactly this version unless --version says otherwise
          sed 's|^CMD=install VERSION="${RM_VERSION:-}"|CMD=install VERSION="${RM_VERSION:-'"$GITHUB_REF_NAME"'}"|' scripts/get.sh > dist/get.sh
          grep -q "$GITHUB_REF_NAME" dist/get.sh

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/get.sh
